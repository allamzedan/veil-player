appId: com.veil.player
productName: VEIL Player
copyright: Copyright 2026 Allam Zedan
directories:
  output: release
files:
  - out/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/uninstaller-sidebar.bmp
  include: build/installer.nsh
  createStartMenuShortcut: true
  shortcutName: VEIL Player
  uninstallDisplayName: VEIL Player
  artifactName: VEIL Player Setup ${version}.exe
portable:
  artifactName: VEIL Player-${version}-portable.exe
asarUnpack:
  - out/preload/**
extraResources:
  - from: out/preload
    to: app.asar.unpacked/out/preload
  - from: build
    to: build
    filter:
      - icon.ico
      - icon.png
fileAssociations:
  - ext: veil
    name: VEIL Playback Instructions
    description: VEIL Playback Instructions
    role: Editor
    icon: build/veil-document.ico
